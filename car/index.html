<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050b1f;font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif;-webkit-text-size-adjust:100%}button{font-family:inherit}
/* وضع التلفزيون */
#tv{position:fixed;inset:0;z-index:300;display:none;color:#fff;overflow:hidden;background:#050b1f;font-size:1vmin;direction:rtl}#tv.on{display:grid;grid-template-rows:1fr auto auto;padding:4vmin 5vw 3vmin;gap:3vmin}
.tvsky{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 0%,var(--tv2,#14224f),transparent 62%),linear-gradient(var(--tv1,#050b1f),#050b1f);transition:background 3s;z-index:-2}
.tvst{position:absolute;inset:0;z-index:-1;opacity:.5;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),radial-gradient(2px 2px at 85% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 80%,#fff,transparent)}
.tvx{position:absolute;top:3vmin;left:4vw;z-index:2;font:inherit;font-size:2.4vmin;color:#fff;background:rgba(255,255,255,.14);border:2px solid transparent;border-radius:99px;padding:1.2vmin 2.6vmin;opacity:.6}.tvx:focus{opacity:1;border-color:#fff;outline:0}
.tvm{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"nx clk" "nx dt";align-content:center;align-items:center;gap:1vmin 5vw;animation:tvd 90s ease-in-out infinite alternate}@keyframes tvd{from{transform:translate(-.6vmin,-.4vmin)}to{transform:translate(.6vmin,.5vmin)}}
.tvcity{position:absolute;top:3.4vmin;right:5vw;font-size:3.4vmin;font-weight:700;opacity:.85}
.tvclk{grid-area:clk;font-size:19vmin;font-weight:800;line-height:1;text-align:center;text-shadow:0 .6vmin 3vmin rgba(0,0,0,.35);font-variant-numeric:tabular-nums}.tvclk em{font-style:normal;opacity:.6;margin:0 .5vmin}.tvclk small{font-size:7vmin;opacity:.6;margin-inline-start:1.2vmin;font-weight:600}
.tvdt{grid-area:dt;text-align:center;font-size:3.6vmin;opacity:.9}
.tvnx{grid-area:nx;text-align:center}.tvl{font-size:4.6vmin;font-weight:700;opacity:.95}.tvcd{font-size:15vmin;font-weight:800;line-height:1.1;margin:1.4vmin 0;font-variant-numeric:tabular-nums;text-shadow:0 .6vmin 3vmin rgba(0,0,0,.35)}.tvbar{height:1.4vmin;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;max-width:80%;margin:0 auto}.tvbar i{display:block;height:100%;background:linear-gradient(90deg,#3cc3b1,#e0b45a);border-radius:9px;transition:width 1s linear}
#tv.adh .tvcd{color:#ffd978;animation:tvp 1.6s ease-in-out infinite}#tv.sooniq .tvcd{color:#ff8a6b}@keyframes tvp{50%{transform:scale(1.04)}}
.tvrow{display:grid;grid-template-columns:repeat(6,1fr);gap:1.6vmin}.tvc{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:.3vmin solid rgba(255,255,255,.12);border-radius:3vmin;padding:2.4vmin 1vmin;text-align:center;transition:all .4s}.tvc span{display:block;font-size:3.2vmin;opacity:.85}.tvc b{display:block;font-size:6.4vmin;margin-top:.6vmin;font-variant-numeric:tabular-nums}
.tvc.ps{opacity:.45}.tvc.nx{background:linear-gradient(135deg,rgba(60,195,177,.55),rgba(224,180,90,.5));border-color:#fff;transform:scale(1.05);box-shadow:0 1vmin 5vmin rgba(60,195,177,.35)}.tvc.cu{background:rgba(255,217,120,.3);border-color:#ffd978}
.tvft{text-align:center;font-size:3.2vmin;opacity:0;transition:opacity .5s;font-family:var(--af,inherit);min-height:5vmin}.tvft.on{opacity:.8}
@media(max-aspect-ratio:1/1){.tvm{grid-template-columns:1fr;grid-template-areas:"clk" "dt" "nx";gap:3vmin}.tvclk{font-size:22vmin}.tvcd{font-size:17vmin}.tvrow{grid-template-columns:repeat(3,1fr)}}
html.tvon,html.tvon body{overflow:hidden}
#nvb{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;object-fit:cover;z-index:39;display:block;opacity:0;visibility:visible;transition:opacity .5s;background:#000;pointer-events:none;transform:translateZ(0)}
#nvb.on{opacity:1}
.nvon .np{background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.5))!important;--ink:#fff;--mute:rgba(255,255,255,.78);--card:rgba(0,0,0,.35);--line:rgba(255,255,255,.25);color:#fff!important}
.nvon .np h2,.nvon .np .sub,.nvon .np .nphl,.nvon .np .npt{color:#fff!important;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.nvon .np button{color:#fff!important}.nvon .np .npb button{background:rgba(0,0,0,.35)!important;border-color:rgba(255,255,255,.3)!important}
.nvon .np .npb button.hot{color:#8ff5d4!important;border-color:#8ff5d4!important}
/* الطقس */
.wqi{overflow:visible;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}.wqrt{transform-origin:32px 32px;animation:wxro 24s linear infinite}@keyframes wxro{to{transform:rotate(360deg)}}
.wqcl{animation:wxcd 6s ease-in-out infinite alternate}@keyframes wxcd{from{transform:translateX(-1.5px)}to{transform:translateX(2px)}}
.wqdr{animation:wxdp 1.1s linear infinite}@keyframes wxdp{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(10px);opacity:0}}
.wqbt{animation:wxbl 3.2s steps(1) infinite}@keyframes wxbl{0%,60%,100%{opacity:1}64%,68%{opacity:.15}72%{opacity:1}}
.wqtw{animation:wqtw 2.4s ease-in-out infinite}@keyframes wqtw{50%{opacity:.2}}.wqfg{animation:wxfd 4s ease-in-out infinite alternate}@keyframes wxfd{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
@media(prefers-reduced-motion:reduce){.wqrt,.wqcl,.wqdr,.wqbt,.wqtw,.wqfg{animation:none}}
.wqc{--a:#2b86d9;--b:#74c8f4;background:linear-gradient(155deg,var(--a),var(--b));color:#fff;border-radius:26px;padding:16px 16px 10px;margin:0 0 14px;box-shadow:0 14px 34px rgba(0,0,0,.22);position:relative;overflow:hidden;transition:background .6s}
.wqc:before{content:"";position:absolute;inset:-40% -20% auto auto;width:70%;height:90%;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent);pointer-events:none}
.wqtop{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;opacity:.95;position:relative}.wqtop button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:12px;min-height:30px}
.wqm{display:flex;align-items:center;gap:12px;margin:6px 0 10px;position:relative}.wqtt{display:flex;flex-direction:column}.wqtt b{font-size:58px;line-height:1;font-weight:800;letter-spacing:-1px}.wqtt span{font-size:18px;font-weight:700;margin-top:2px}.wqtt small{font-size:12px;opacity:.88;margin-top:4px}
.wqst{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border-radius:16px;padding:10px 6px;position:relative}.wqst div{text-align:center}.wqst span{display:block;font-size:10.5px;opacity:.85}.wqst b{font-size:15px}
.wqh{display:flex;gap:4px;overflow-x:auto;margin-top:10px;padding:8px 2px;position:relative;scrollbar-width:none}.wqh::-webkit-scrollbar{display:none}.wqh>div{flex:none;min-width:54px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.12);border-radius:14px;padding:8px 4px}.wqh small{font-size:11px;opacity:.85}.wqh b{font-size:14px}.wqh em{font-style:normal;font-size:10px;color:#bfe6ff}
.wqdy{margin-top:6px;position:relative}.wqdy>div{display:flex;align-items:center;gap:8px;padding:6px 2px;border-top:1px solid rgba(255,255,255,.18)}.wqdy span{width:70px;font-size:13.5px;font-weight:600}.wqdy b{width:30px;font-size:13px;text-align:center}.wqdy i{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.22);display:flex;direction:ltr}.wqdy u{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#8fe3ff,#ffd36b)}
.wqsrc{display:block;text-align:center;font-size:10px;opacity:.6;margin-top:8px;position:relative}.wqe{text-align:center;padding:18px 6px}.wqe p{margin:0 0 10px;font-size:14px}.wqs{display:flex;gap:8px;padding:30px 0;justify-content:center}.wqs i{width:12px;height:12px;border-radius:50%;background:#fff;opacity:.5;animation:wqs 1s ease-in-out infinite}.wqs i:nth-child(2){animation-delay:.15s}.wqs i:nth-child(3){animation-delay:.3s}@keyframes wqs{50%{transform:translateY(-8px);opacity:1}}

#az{background:radial-gradient(120% 90% at 85% 0%,var(--g1) 0%,var(--g2) 70%);color:#fff;font-family:"TazHud","IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;padding:3vmin 4vw 2.4vmin;justify-content:flex-start;align-items:stretch;transition:background .5s}
#az:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(40vmin 40vmin at 12% 88%,color-mix(in srgb,var(--a) 16%,transparent),transparent 70%),repeating-conic-gradient(from 0deg at 88% 12%,color-mix(in srgb,var(--a) 7%,transparent) 0 6deg,transparent 6deg 24deg);-webkit-mask-image:radial-gradient(60vmin 60vmin at 88% 12%,#000,transparent);mask-image:radial-gradient(60vmin 60vmin at 88% 12%,#000,transparent)}
#az>*{position:relative}
.azh{display:flex;align-items:center;justify-content:space-between;margin-bottom:2vmin}.azt{display:flex;align-items:center;gap:2vmin}.azt b{font-size:4.6vmin;font-weight:700;display:block;line-height:1.2}.azt small{font-size:2.3vmin;opacity:.75;display:block;margin-top:.4vmin}
.azi{width:8vmin;height:8vmin;border-radius:50%;display:grid;place-items:center;color:var(--a);background:color-mix(in srgb,var(--a) 16%,transparent);border:.25vmin solid color-mix(in srgb,var(--a) 50%,transparent)}.azi svg{width:5vmin;height:5vmin}
#azx{font:inherit;font-size:2.6vmin;padding:1.2vmin 2.8vmin;border-radius:5vmin;border:.3vmin solid #fff3;background:#ffffff14;color:#fff}
.azs{display:flex;gap:1.4vmin;overflow-x:auto;padding:.6vmin .4vmin 1.6vmin;scrollbar-width:none;margin-bottom:1vmin}.azs::-webkit-scrollbar{display:none}
.azs button{flex:none;font:inherit;font-size:2.8vmin;padding:1.2vmin 3vmin;border-radius:5vmin;border:.3vmin solid #fff2;background:#ffffff0f;color:#fffc;white-space:nowrap}
.azs button.on{background:var(--a);border-color:var(--a);color:#101010;font-weight:700}
.azm{flex:1;min-height:0;display:flex;align-items:center;gap:2.4vmin}

.wom{display:flex;align-items:center;justify-content:center;gap:5vmin}.wom .wqi{width:26vmin;height:26vmin}.wom b{font-size:25vmin;line-height:1;font-weight:800}.wom span{display:block;font-size:5vmin;font-weight:700}.wom small{display:block;font-size:2.8vmin;opacity:.9;margin-top:1vmin}
.wos{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6vmin;align-self:center}.wos>div{background:rgba(255,255,255,.16);border-radius:3vmin;padding:2vmin;text-align:center}.wos span{display:block;font-size:2.4vmin;opacity:.85}.wos b{font-size:5vmin}
.wob{display:flex;flex-direction:column;gap:1.6vmin}.woh,.wod{display:flex;gap:1.2vmin;justify-content:center}.woh>div,.wod>div{flex:1;max-width:15vmin;background:rgba(255,255,255,.14);border-radius:2.4vmin;padding:1.2vmin .6vmin;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.4vmin}.woh small,.wod small{font-size:2vmin;opacity:.85}.woh b,.wod b{font-size:3vmin}.woh .wqi,.wod .wqi{width:6.4vmin;height:6.4vmin}.wod i{font-style:normal;font-size:2.2vmin;opacity:.7}.wod>div{max-width:20vmin}
@media(max-aspect-ratio:1/1){.wom{flex-direction:column;gap:1vmin}.wom b{font-size:20vmin}.wos{grid-template-columns:repeat(2,1fr)}.woh>div:nth-child(n+7){display:none}.wod>div:nth-child(n+5){display:none}}
#mini{position:fixed;z-index:310;bottom:34vmin;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:1.6vmin;background:rgba(10,14,34,.82);backdrop-filter:blur(14px);border:.3vmin solid rgba(255,255,255,.18);border-radius:99px;padding:1vmin 1.6vmin;color:#fff;box-shadow:0 1.4vmin 4vmin rgba(0,0,0,.4);max-width:56vw;direction:rtl}#mini.on{display:flex}#mini button{font:inherit;color:#fff;background:rgba(255,255,255,.12);border:.3vmin solid transparent;border-radius:50%;width:6.4vmin;height:6.4vmin;display:grid;place-items:center;cursor:pointer;flex:none}#mini button:focus,#mini button:hover{outline:0;border-color:#fff;background:linear-gradient(135deg,rgba(60,195,177,.6),rgba(224,180,90,.5))}#mini .ic{width:3.2vmin;height:3.2vmin}#mini #mpp{background:#0f8f83}.mmt{min-width:0;display:flex;flex-direction:column;gap:.5vmin;flex:1}.mmt b{font-size:2.6vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mmt small{font-size:2vmin;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mmb{height:.7vmin;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden;direction:ltr}.mmb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3cc3b1,#e0b45a)}
@media(max-aspect-ratio:1/1){#mini{bottom:22vmin;max-width:92vw}}

#cr .crnp .crhero{display:grid;place-items:center}
#cr .crros{width:min(34vmin,100%);height:auto;max-height:100%;filter:drop-shadow(0 1.6vmin 4vmin rgba(0,0,0,.5))}
#cr .crinf{display:flex;flex-direction:column;gap:1vmin;min-width:0;text-align:center}
#cr .crinf .crsn{font-size:7vmin;font-weight:800;color:#fff;line-height:1.1}#cr .crinf .crrn{font-size:2.8vmin;color:#cbd5e1}
#cr .crnp .crct{display:flex;justify-content:center;align-items:center;gap:1.8vmin;margin:.6vmin 0}
#cr .crnp .crct button{width:10.5vmin;height:10.5vmin;padding:0;border-radius:50%;display:grid;place-items:center;color:#fff;line-height:0}
#cr .crnp .crct button.big{width:15vmin;height:15vmin;color:#10231f}
#cr .crnp .crct button svg{width:4.6vmin;height:4.6vmin}#cr .crnp .crct button.big svg{width:7vmin;height:7vmin}
#cr .crop{display:flex;flex-wrap:wrap;justify-content:center;gap:1.2vmin}
#cr .crop button{display:flex;align-items:center;gap:.9vmin;font:inherit;font-size:2.5vmin;color:#dbe6f5;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:.9vmin 2.2vmin}
#cr .crop svg{width:3vmin;height:3vmin;color:#ffd36b}
#cr .hros{width:15vmin;height:15vmin;filter:drop-shadow(0 .8vmin 1.4vmin rgba(0,0,0,.45))}
@media (max-aspect-ratio:1/1){#cr .crnp{grid-template-columns:1fr!important}}
#cr .crg{grid-auto-rows:max-content!important;min-height:0}
#cr .crtile.rcT,#cr .crtile.s,#cr .crtile.moT{min-height:fit-content!important;height:auto!important;flex:none}
#cr .crch button{font-size:2.8vmin!important;padding:.9vmin 2.4vmin!important}
#cr .crch{flex:none}

/* bell + notifications view */

#cr .crbl svg{width:3.8vmin;height:3.8vmin}#cr .crbl i{display:none;position:absolute;top:.6vmin;right:.7vmin;width:1.8vmin;height:1.8vmin;border-radius:50%;background:#ff4d4f;border:.3vmin solid #0b1630}
#cr .crbl.hot i{display:block}#cr .crbl.hot{color:#ffd36b}
#cr .nt{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(40vmin,1fr));gap:1.6vmin;align-content:start;grid-auto-rows:max-content;padding-bottom:2vmin}
#cr .ntc{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.1);border-radius:3vmin;padding:2vmin 2.6vmin;display:flex;flex-direction:column;gap:1vmin}

#cr .nth{display:flex;align-items:center;gap:1.2vmin;color:#ffd36b}#cr .nth svg{width:3.4vmin;height:3.4vmin}#cr .nth b{font-size:3vmin;color:#fff}
#cr .ntm b{font-size:3vmin;color:#fff}#cr .ntm p{margin:.4vmin 0;font-size:2.7vmin;color:#dbe6f5;line-height:1.5}#cr .ntm small{color:#9fb0c6;font-size:2.2vmin}
#cr .nte{margin:0;font-size:2.7vmin;color:#cbd5e1}
#cr .ntb{display:flex;flex-wrap:wrap;gap:1.2vmin}
#cr .ntb button{font:inherit;font-size:2.6vmin;color:#dbe6f5;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:1vmin 2.6vmin}
#cr .ntb button.pri{background:linear-gradient(135deg,#ffe29a,#f2b94b);color:#1a2a22;font-weight:700;border-color:transparent}#cr .ntb button.on{border-color:rgba(60,195,177,.7);background:rgba(60,195,177,.18)}
#cr .ntl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.8vmin}#cr .ntl li{display:flex;gap:1.4vmin;font-size:2.5vmin;color:#cbd5e1;line-height:1.4}#cr .ntl em{font-style:normal;flex:none;min-width:7vmin;color:#ffd36b;font-weight:700}
#pab{position:fixed;top:2vmin;left:50%;transform:translateX(-50%);z-index:9550;display:flex;flex-direction:column;align-items:center;gap:.4vmin;min-width:50vmin;padding:1.6vmin 6vmin;border-radius:3.4vmin;background:linear-gradient(135deg,#0d5a4b,#0a2f3d);border:1px solid rgba(255,211,107,.6);color:#fff;box-shadow:0 1.4vmin 5vmin rgba(0,0,0,.55);animation:pai .5s ease}
#pab b{font-size:4vmin;color:#ffe29a}#pab small{font-size:2.6vmin;color:#cbd5e1}#pab button{position:absolute;top:.6vmin;left:1.4vmin;font:inherit;font-size:4vmin;line-height:1;color:#fff;background:transparent;border:0;padding:.4vmin 1vmin}
@keyframes pai{from{opacity:0;transform:translateX(-50%) translateY(-3vmin)}}

#cr .maplibregl-ctrl-bottom-right,#cr .maplibregl-ctrl-bottom-left,#cr .maplibregl-ctrl-attrib,#cr .maplibregl-ctrl-logo{display:none!important}
#ckb{position:fixed;left:50%;transform:translateX(-50%);width:min(100%,640px);border-radius:16px 16px 0 0;bottom:0;z-index:99999;display:none;flex-direction:column;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(14,18,26,.97);border-top:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);direction:rtl;user-select:none;-webkit-user-select:none;touch-action:manipulation}

#ckb .kbv{flex:1;min-height:34px;line-height:34px;padding:0 12px;border-radius:10px;background:rgba(0,0,0,.35);color:#fff;font-size:clamp(16px,4vh,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#cr .maplibregl-control-container,#cr .maplibregl-ctrl,#cr .mpr:empty{display:none!important}#cr .mpr{background:none!important;box-shadow:none!important}
#ckb .kbr:not(.kbt) .kk{flex:0 0 calc((100% - 66px)/12);max-width:none}

#ckb .kbr .kw{flex:0 0 calc((100% - 66px)/8)}
#ckb .kbr .ksp{flex:1 1 auto}
#ckb .kbk{background:rgba(255,255,255,.22);color:#fff}
#ckb .kbr .kk.ksp{flex:1 1 0!important;min-width:0}#ckb .kbr .kk.kw{flex:0 0 12%!important}#ckb .kbr .kk.kgo{flex:0 0 16%!important}
#cr .mpg3{display:flex;gap:8px;flex-wrap:wrap}#cr .mpg3 a{flex:1 1 auto;text-align:center;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-weight:700;text-decoration:none}#cr .mpg3 a:first-child{background:#1a73e8}
#cr .mpgg{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:2;background:#1b1f27;border-radius:inherit}#cr .mp>*:not(.mpgg):not(.mpv){z-index:5}

#cnv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:299;opacity:0;transition:opacity 1s;pointer-events:none;background:#000}
#cnv.on{opacity:1;animation:cnk 30s ease-in-out infinite alternate}
@keyframes cnk{from{transform:scale(1)}to{transform:scale(1.08) translate(-1%,-.8%)}}
body.cnvon #cr{background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.55))!important}
body.cnvon #cr .crnp{background:transparent!important;border-color:rgba(255,255,255,.18)!important;backdrop-filter:none!important;box-shadow:none!important}
body.cnvon #cr .crnp .crsn,body.cnvon #cr .crnp .crrn{text-shadow:0 2px 10px rgba(0,0,0,.7)}
body.cnvon #cr .crros{animation:nps 40s linear infinite;filter:drop-shadow(0 2vmin 5vmin rgba(60,195,177,.35))}
@keyframes nps{to{transform:rotate(360deg)}}

#cwv{position:fixed;inset:0;z-index:9000;background:radial-gradient(circle at 50% 40%,#0c1a33,#02050d 70%);display:none;touch-action:none;--hc:#7fe3d4}
#cwv.on{display:flex;align-items:center;justify-content:center;gap:5vmin;padding:6vmin;animation:cwi .8s ease}@keyframes cwi{from{opacity:0}to{opacity:1}}

#cwv .cwh{flex:0 0 auto;width:min(44vmin,360px);aspect-ratio:1;filter:drop-shadow(0 2vmin 5vmin rgba(60,195,177,.3))}

#cwv .cwr{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;text-shadow:0 .4vmin 2vmin rgba(0,0,0,.5)}
#cwv .cwt b{display:block;font-size:8vmin;font-weight:800;line-height:1.2}
#cwv .cwt span{display:block;font-size:3.2vmin;opacity:.9;color:var(--hc)}
#cwv canvas{width:100%;height:20vmin;margin-top:3vmin}
#cnf{position:fixed;inset:0;width:100%;height:100%;z-index:299;pointer-events:none;display:none}

/* ===== HUD طقس/سرعة ===== */

/* ===== مشغّل مصغّر عام ===== */
#cgm{position:fixed;left:3vmin;bottom:2.4vmin;z-index:9050;display:none;align-items:center;gap:.8vmin;padding:.9vmin 1.2vmin .9vmin 1vmin;width:min(62vw,560px);border-radius:99px;background:rgba(10,18,32,.9);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);box-shadow:0 1.2vmin 3.6vmin rgba(0,0,0,.5);direction:rtl;overflow:hidden}

#cgm .gmt{min-width:0;display:flex;flex-direction:column}#cgm .gmt b{font-size:2.7vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#cgm .gmt small{font-size:2vmin;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cgm .gmp{flex:0 0 auto;width:7.6vmin;height:7.6vmin;border-radius:50%;border:0;background:#f8d57e;color:#2b1f00;display:grid;place-items:center;cursor:pointer}

#cgm .gmb{position:absolute;left:0;right:0;bottom:0;height:.7vmin;background:rgba(255,255,255,.1);direction:rtl}#cgm .gmb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3cc3b1,#f8d57e)}
body.gmpd #mpm{display:none!important}
body.gmon #cr .crmn,body.gmon #cr .crm{padding-bottom:13vmin!important}
body.gmon #az{padding-bottom:13vmin!important}

/* ===== مشغّل الصوتيات الكامل ===== */

#cr .pdfp{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"c c" "a i";align-items:center;gap:2vmin 5vmin;padding:2vmin 3vmin;border-radius:4.5vmin;position:relative;overflow:hidden;background:radial-gradient(90% 120% at 15% 50%,hsla(var(--ph),60%,38%,.55),transparent 70%),linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12)}
#cr .pdfc{grid-area:c;justify-self:start;display:flex;align-items:center;gap:.8vmin;font:inherit;font-size:2.6vmin;color:#ffe29a;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:.8vmin 2.2vmin;cursor:pointer;transform:rotate(-90deg);transform-origin:center}
#cr .pdfc{transform:none}#cr .pdfc svg{transform:rotate(-90deg)}
#cr .pdfa{grid-area:a;display:grid;place-items:center}

@keyframes pdpu{from{transform:scale(.92);opacity:.9}to{transform:scale(1.12);opacity:0}}
#cr .pdfi{grid-area:i;min-width:0;text-align:center;display:flex;flex-direction:column;gap:1.4vmin}
#cr .pdft{font-size:5vmin;font-weight:800;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#cr .pdfs{font-size:2.8vmin;color:#9fe6d2;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cr .pdsk.big{height:1.6vmin;border-radius:1vmin;background:rgba(255,255,255,.16);overflow:hidden;direction:rtl;cursor:pointer;margin-top:1vmin}
#cr .pdsk.big i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3cc3b1,#f8d57e);border-radius:inherit}
#cr .pdtm{font-size:2.4vmin;opacity:.75;text-align:center}
#cr .pdlv{align-self:center;display:inline-flex;align-items:center;gap:1vmin;font-size:2.8vmin;font-weight:700;color:#fff;background:rgba(220,40,60,.85);border-radius:99px;padding:.6vmin 2.4vmin}

#cr .pdnt{cursor:pointer}
@media (max-aspect-ratio:1/1){#cr .pdfp{grid-template-columns:1fr;grid-template-areas:"c" "a" "i"}}

#cr .pdweb{grid-column:1/-1;width:100%;height:56vh;min-height:200px;border:1px solid rgba(255,255,255,.14);border-radius:3vmin;background:#fff}#cr .pdext{grid-column:1/-1;text-align:center;color:#ffe29a;font-size:2.8vmin;padding:1vmin}

var AZD={"AD":["الصباح","المساء","النوم","الاستيقاظ","بعد الصلاة","السفر","الطعام","أدعية قرآنية","التسبيح"],"AK":[{"n":"أذكار الصباح — بعد الفجر إلى الشروق (ترجيح القنوبي)","p":"ص 159–162","l":[["سيد الاستغفار","اللَّهُمَّ أَنْتَ رَبِّي، لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي؛ فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.","مرة واحدة",0],["التوكل على الله","فَإِن تَوَلَّوْاْ فَقُلْ حَسْبِيَ ࡰ۬للَّهُۖ لَا إِلَٰهَ إِلَّا هُوَۖ عَلَيْهِ تَوَكَّلْتُۖ وَهْوَ رَبُّ ࡲ۬لْعَرْشِ ࡴ۬لْعَظِيمِۖ ۝١٣٠","سبع مرات (من «حسبي الله» إلى آخر الآية)",1],["سورة الإخلاص","قُلْ هُوَ ࡰ۬للَّهُ أَحَدٌۖ ۝١ ࡴ۬للَّهُ ࡲ۬لصَّمَدُۖ ۝٢ لَمْ يَلِدْ وَلَمْ يُولَدْۖ ۝٣ وَلَمْ يَكُن لَّهُۥ كُفُؤاً أَحَدُۢۖ ۝٤","ثلاث مرات",1],["سورة الفلق","قُلْ أَعُوذُ بِرَبِّ ࡴ۬لْفَلَقِ ۝١ مِن شَرِّ مَا خَلَقَ ۝٢ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝٣ وَمِن شَرِّ ࡴ۬لنَّفَّٰثَٰتِ فِے ࡴ۬لْعُقَدِ ۝٤ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَۖ ۝٥","ثلاث مرات",1],["سورة الناس","قُلْ أَعُوذُ بِرَبِّ ࡴ۬لنَّاسِ ۝١ مَلِكِ ࡴ۬لنَّاسِ ۝٢ إِلَٰهِ ࡴ۬لنَّاسِ ۝٣ مِن شَرِّ ࡴ۬لْوَسْوَاسِ ࡴ۬لْخَنَّاسِ ۝٤ ࡴ۬لذِے يُوَسْوِسُ فِے صُدُورِ ࡴ۬لنَّاسِ ۝٥ مِنَ ࡰ۬لْجِنَّةِ وَالنَّاسِۖ ۝٦","ثلاث مرات",1],["التهليل","لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.","مرة أو مئة مرة",0],["التسبيح","سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ، رِضَا نَفْسِهِ، زِنَةَ عَرْشِهِ، مِدَادَ كَلِمَاتِهِ","كل واحدة ثلاث مرات",0],["التسبيح","سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","مئة مرة",0],["دعاء الصباح","اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ.","",0],["خير اليوم","أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. رَبِّ أَسْأَلُكَ خَيْرَ هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ.","",0],["العافية","اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ. اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي.","",0],["الحفظ من الضرر","بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ، وَهُوَ السَّمِيعُ الْعَلِيمُ.","ثلاث مرات",0]]},{"n":"أذكار المساء — بعد العصر إلى الغروب (ترجيح القنوبي)","p":"ص 163–165","l":[["سيد الاستغفار","اللَّهُمَّ أَنْتَ رَبِّي، لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي؛ فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.","مرة واحدة",0],["سورة الإخلاص","قُلْ هُوَ ࡰ۬للَّهُ أَحَدٌۖ ۝١ ࡴ۬للَّهُ ࡲ۬لصَّمَدُۖ ۝٢ لَمْ يَلِدْ وَلَمْ يُولَدْۖ ۝٣ وَلَمْ يَكُن لَّهُۥ كُفُؤاً أَحَدُۢۖ ۝٤","ثلاث مرات",1],["سورة الفلق","قُلْ أَعُوذُ بِرَبِّ ࡴ۬لْفَلَقِ ۝١ مِن شَرِّ مَا خَلَقَ ۝٢ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝٣ وَمِن شَرِّ ࡴ۬لنَّفَّٰثَٰتِ فِے ࡴ۬لْعُقَدِ ۝٤ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَۖ ۝٥","ثلاث مرات",1],["سورة الناس","قُلْ أَعُوذُ بِرَبِّ ࡴ۬لنَّاسِ ۝١ مَلِكِ ࡴ۬لنَّاسِ ۝٢ إِلَٰهِ ࡴ۬لنَّاسِ ۝٣ مِن شَرِّ ࡴ۬لْوَسْوَاسِ ࡴ۬لْخَنَّاسِ ۝٤ ࡴ۬لذِے يُوَسْوِسُ فِے صُدُورِ ࡴ۬لنَّاسِ ۝٥ مِنَ ࡰ۬لْجِنَّةِ وَالنَّاسِۖ ۝٦","ثلاث مرات",1],["التهليل","لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.","مرة أو مئة مرة",0],["التسبيح","سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","مئة مرة",0],["دعاء المساء","اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ.","",0],["خير الليلة","أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. رَبِّ أَسْأَلُكَ خَيْرَ هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا.","",0],["الحفظ من الضرر","بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ، وَهُوَ السَّمِيعُ الْعَلِيمُ.","ثلاث مرات",0]]},{"n":"أذكار النوم","p":"ص 177–180","l":[["دعاء النوم","بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا.","",0],["الاستعاذة","أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ غَضَبِهِ وَعِقَابِهِ، وَشَرِّ عِبَادِهِ، وَمِنْ هَمَزَاتِ الشَّيَاطِينِ وَأَنْ يَحْضُرُونِ.","",0],["تفويض الأمر","اللَّهُمَّ أَسْلَمْتُ وَجْهِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ.","",0],["المعوذات","الإخلاص والفلق والناس، مع النفث في الكفين ومسح ما استطاع من الجسد","ثلاث مرات",0],["آخر آيتين من سورة البقرة","ءَامَنَ ࡰ۬لرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِۦ وَالْمُؤْمِنُونَۖ كُلٌّ ءَامَنَ بِاللَّهِ وَمَلَٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦۖ لَا نُفَرِّقُ بَيْنَ أَحَدࣲ مِّن رُّسُلِهِۦۖ وَقَالُواْ سَمِعْنَا وَأَطَعْنَاۖ غُفْرَانَكَ رَبَّنَاۖ وَإِلَيْكَ ࡰ۬لْمَصِيرُۖ ۝٢٨٤ لَا يُكَلِّفُ ࡲ۬للَّهُ نَفْساً إِلَّا وُسْعَهَاۖ لَهَا مَا كَسَبَتْۖ وَعَلَيْهَا مَا ࡰٜكْتَسَبَتْۖ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَاۖ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْراࣰ كَمَا حَمَلْتَهُۥ عَلَى ࡰ۬لذِينَ مِن قَبْلِنَاۖ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦۖ وَاعْفُ عَنَّاۖ وَاغْفِرْ لَنَاۖ وَارْحَمْنَاۖ أَنتَ مَوْلَيٰنَا فَانصُرْنَا عَلَى ࡰ۬لْقَوْمِ ࡴ۬لْكَٰفِرِينَۖ ۝٢٨٥","البقرة: 284–285",1]]},{"n":"أذكار الاستيقاظ (من الليل)","p":"باب ما يقوله من استيقظ من الليل","l":[["التهليل","لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.","",0],["التحميد والتسبيح","الْحَمْدُ لِلَّهِ، وَسُبْحَانَ اللَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ.","",0],["الاستغفار","رَبِّ اغْفِرْ لِي.","ثم يصلي إن شاء",0]]},{"n":"أذكار بعد الصلاة","p":"صيغ مشهورة بحسب الناقل؛ لم يُحدَّد الباب ولا الصفحة في كتاب إباضي","l":[["الاستغفار","أَسْتَغْفِرُ اللَّهَ، أَسْتَغْفِرُ اللَّهَ، أَسْتَغْفِرُ اللَّهَ.","ثلاث مرات",0],["دعاء السلام","اللَّهُمَّ أَنْتَ السَّلَامُ، وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ.","",0],["التسبيح والتحميد والتكبير","سُبْحَانَ اللَّهِ · الْحَمْدُ لِلَّهِ · اللَّهُ أَكْبَرُ","33 مرة لكل منها",0],["تمام المئة","لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.","",0],["آية الكرسي","ࡰ۬للَّهُ لَا إِلَٰهَ إِلَّا هُوَۖ ࡰ۬لْحَيُّ ࡲ۬لْقَيُّومُۖ ۝٢٥٣","البقرة: 253",1]]},{"n":"أذكار السفر والركوب","p":"صيغ مشهورة بحسب الناقل؛ لم يُحدَّد الباب ولا الصفحة في كتاب إباضي","l":[["الخروج من المنزل","بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ.","",0],["ركوب وسيلة النقل","بِسْمِ اللَّهِ. الْحَمْدُ لِلَّهِ.","",0],["دعاء الركوب","لِتَسْتَوُۥاْ عَلَىٰ ظُهُورِهِۦ ثُمَّ تَذْكُرُواْ نِعْمَةَ رَبِّكُمْ إِذَا ࡰٜسْتَوَيْتُمْ عَلَيْهِ وَتَقُولُواْ سُبْحَٰنَ ࡰ۬لذِے سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُۥ مُقْرِنِينَ ۝١٢ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنقَلِبُونَۖ ۝١٣","الزخرف: 12–13",1],["دعاء السفر","اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى. اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا، وَاطْوِ عَنَّا بُعْدَهُ. اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ، وَالْخَلِيفَةُ فِي الْأَهْلِ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ وَعْثَاءِ السَّفَرِ، وَكَآبَةِ الْمَنْظَرِ، وَسُوءِ الْمُنْقَلَبِ فِي الْمَالِ وَالْأَهْلِ.","",0],["عند العودة","آيِبُونَ، تَائِبُونَ، عَابِدُونَ، لِرَبِّنَا حَامِدُونَ.","",0],["عند النزول في مكان","أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.","",0]]},{"n":"أذكار الطعام والشراب","p":"صيغ مشهورة بحسب الناقل؛ لم يُحدَّد الباب ولا الصفحة في كتاب إباضي","l":[["قبل الطعام","بِسْمِ اللَّهِ.","",0],["إذا نسي التسمية","بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ.","",0],["بعد الطعام","الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ.","",0],["دعاء لمن يقدم الطعام","اللَّهُمَّ بَارِكْ لَهُمْ فِيمَا رَزَقْتَهُمْ، وَاغْفِرْ لَهُمْ وَارْحَمْهُمْ.","",0],["عند الشرب وبعده","بِسْمِ اللَّهِ. وبعده: الْحَمْدُ لِلَّهِ.","",0]]},{"n":"أدعية من القرآن الكريم","p":"آيات: تُدرج نصوصها من المصحف الموثق برواية قالون","l":[["دعاء آدم","قَالَا رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ ࡰ۬لْخَٰسِرِينَۖ ۝٢٢","الأعراف: 22",1],["دعاء نوح","قَالَ رَبِّ إِنِّيَ أَعُوذُ بِكَ أَنْ أَسْـَٔلَكَ مَا لَيْسَ لِے بِهِۦ عِلْمࣱۖ وَإِلَّا تَغْفِرْ لِے وَتَرْحَمْنِے أَكُن مِّنَ ࡰ۬لْخَٰسِرِينَۖ ۝٤٧","هود: 47",1],["دعاء إبراهيم","رَبِّ ࡴٜجْعَلْنِے مُقِيمَ ࡰ۬لصَّلَوٰةِ وَمِن ذُرِّيَّتِےۖ رَبَّنَا وَتَقَبَّلْ دُعَآءِۖ ۝٤٢","إبراهيم: 42",1],["دعاء موسى","۞ قَالَ رَبِّ ࡴٜشْرَحْ لِے صَدْرِے ۝٢٤ وَيَسِّرْ لِيَ أَمْرِے ۝٢٥ وَاحْلُلْ عُقْدَةࣰ مِّن لِّسَانِے ۝٢٦ يَفْقَهُواْ قَوْلِے ۝٢٧","طه: 24–27",1],["دعاء يونس","۞ وَذَا ࡰ۬لنُّونِ إِذ ذَّهَبَ مُغَٰضِباࣰ فَظَنَّ أَن لَّن نَّقْدِرَ عَلَيْهِ فَنَادَىٰ فِے ࡴ۬لظُّلُمَٰتِ أَن لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَٰنَكَ إِنِّے كُنتُ مِنَ ࡰ۬لظَّٰلِمِينَۖ ۝٨٦","الأنبياء: 86",1],["دعاء زكريا","وَزَكَرِيَّآءَ ࡹذْ نَادَىٰ رَبَّهُۥ رَبِّ لَا تَذَرْنِے فَرْداࣰ وَأَنتَ خَيْرُ ࡲ۬لْوَٰرِثِينَۖ ۝٨٨","الأنبياء: 88",1],["دعاء سليمان","فَتَبَسَّمَ ضَاحِكاࣰ مِّن قَوْلِهَا وَقَالَ رَبِّ أَوْزِعْنِے أَنْ أَشْكُرَ نِعْمَتَكَ ࡰ۬لتِے أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَٰلِدَيَّ وَأَنْ أَعْمَلَ صَٰلِحاࣰ تَرْضَيٰهُ وَأَدْخِلْنِے بِرَحْمَتِكَ فِے عِبَادِكَ ࡰ۬لصَّٰلِحِينَۖ ۝١٩","النمل: 19",1],["دعاء جامع","فَإِذَا قَضَيْتُم مَّنَٰسِكَكُمْ فَاذْكُرُواْ ࡲ۬للَّهَ كَذِكْرِكُمْ ءَابَآءَكُمْ أَوْ أَشَدَّ ذِكْراࣰۖ فَمِنَ ࡰ۬لنَّاسِ مَنْ يَّقُولُ رَبَّنَا ءَاتِنَا فِے ࡴ۬لدُّنْيَا وَمَا لَهُۥ فِے ࡴ۬لْأٓخِرَةِ مِنْ خَلَٰقࣲۖ وَمِنْهُم مَّنْ يَّقُولُ رَبَّنَا ءَاتِنَا فِے ࡴ۬لدُّنْيَا حَسَنَةࣰ وَفِے ࡴ۬لْأٓخِرَةِ حَسَن
