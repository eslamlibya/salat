*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050b1f;font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif;-webkit-text-size-adjust:100%}button{font-family:inherit}
/* وضع التلفزيون */
#tv{position:fixed;inset:0;z-index:300;display:none;color:#fff;overflow:hidden;background:#050b1f;font-size:1vmin;direction:rtl}#tv.on{display:grid;grid-template-rows:1fr auto auto;padding:4vmin 5vw 3vmin;gap:3vmin}
.tvsky{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 0%,var(--tv2,#14224f),transparent 62%),linear-gradient(var(--tv1,#050b1f),#050b1f);transition:background 3s;z-index:-2}
.tvst{position:absolute;inset:0;z-index:-1;opacity:.5;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),radial-gradient(2px 2px at 85% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 80%,#fff,transparent)}
.tvx{position:absolute;top:3vmin;left:4vw;z-index:2;font:inherit;font-size:2.4vmin;color:#fff;background:rgba(255,255,255,.14);border:2px solid transparent;border-radius:99px;padding:1.2vmin 2.6vmin;opacity:.6}.tvx:focus{opacity:1;border-color:#fff;outline:0}
.tvm{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"nx clk" "nx dt";align-content:center;align-items:center;gap:1vmin 5vw;animation:tvd 90s ease-in-out infinite alternate}@keyframes tvd{from{transform:translate(-.6vmin,-.4vmin)}to{transform:translate(.6vmin,.5vmin)}}
.tvcity{position:absolute;top:3.4vmin;right:5vw;font-size:3.4vmin;font-weight:700;opacity:.85}
.tvclk{grid-area:clk;font-size:19vmin;font-weight:800;line-height:1;text-align:center;text-shadow:0 .6vmin 3vmin rgba(0,0,0,.35);font-variant-numeric:tabular-nums}.tvclk em{font-style:normal;opacity:.6;margin:0 .5vmin}.tvclk small{font-size:7vmin;opacity:.6;margin-inline-start:1.2vmin;font-weight:600}
.tvdt{grid-area:dt;text-align:center;font-size:3.6vmin;opacity:.9}
.tvnx{grid-area:nx;text-align:center}.tvl{font-size:4.6vmin;font-weight:700;opacity:.95}.tvcd{font-size:15vmin;font-weight:800;line-height:1.1;margin:1.4vmin 0;font-variant-numeric:tabular-nums;text-shadow:0 .6vmin 3vmin rgba(0,0,0,.35)}.tvbar{height:1.4vmin;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;max-width:80%;margin:0 auto}.tvbar i{display:block;height:100%;background:linear-gradient(90deg,#3cc3b1,#e0b45a);border-radius:9px;transition:width 1s linear}
#tv.adh .tvcd{color:#ffd978;animation:tvp 1.6s ease-in-out infinite}#tv.sooniq .tvcd{color:#ff8a6b}@keyframes tvp{50%{transform:scale(1.04)}}
.tvrow{display:grid;grid-template-columns:repeat(6,1fr);gap:1.6vmin}.tvc{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:.3vmin solid rgba(255,255,255,.12);border-radius:3vmin;padding:2.4vmin 1vmin;text-align:center;transition:all .4s}.tvc span{display:block;font-size:3.2vmin;opacity:.85}.tvc b{display:block;font-size:6.4vmin;margin-top:.6vmin;font-variant-numeric:tabular-nums}
.tvc.ps{opacity:.45}.tvc.nx{background:linear-gradient(135deg,rgba(60,195,177,.55),rgba(224,180,90,.5));border-color:#fff;transform:scale(1.05);box-shadow:0 1vmin 5vmin rgba(60,195,177,.35)}.tvc.cu{background:rgba(255,217,120,.3);border-color:#ffd978}
.tvft{text-align:center;font-size:3.2vmin;opacity:0;transition:opacity .5s;font-family:var(--af,inherit);min-height:5vmin}.tvft.on{opacity:.8}
