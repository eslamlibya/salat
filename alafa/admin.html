<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة تحكم ALAFA</title>
<meta name="theme-color" content="#e31e24">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login .box { background: #fff; border-radius: 20px; box-shadow: var(--shadow); padding: 28px 22px; width: 100%; max-width: 360px; text-align: center; }
  .login img { width: 240px; margin: 0 auto 10px; }

  .app { display: none; min-height: 100vh; }
  .app.on { display: flex; }
  aside { width: 230px; background: #fff; border-left: 1px solid var(--line); padding: 16px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; flex-shrink: 0; }
  aside img { width: 170px; margin: 0 auto 16px; }
  aside button.nav { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; background: none; padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: right; font-weight: 500; margin-bottom: 2px; }
  aside button.nav:hover { background: var(--bg); }
  aside button.nav.on { background: var(--red-l); color: var(--red); font-weight: 700; }
  aside .grow { flex: 1; }
  .content { flex: 1; min-width: 0; padding: 20px; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .head h1 { margin: 0; font-size: 22px; flex: 1; }
  .menu-btn { display: none; }

  @media (max-width: 860px) {
    aside { position: fixed; right: 0; z-index: 45; transform: translateX(100%); transition: .2s; box-shadow: -4px 0 20px rgba(0,0,0,.1); }
    aside.open { transform: none; }
    .menu-btn { display: inline-flex; }
    .content { padding: 14px; }
  }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .stat small { color: var(--muted); display: block; }
  .stat b { font-size: 24px; display: block; margin-top: 4px; }
  .stat.red { background: var(--red); color: #fff; }
  .stat.red small { color: rgba(255,255,255,.85); }

  .panel { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
  .panel h3 { margin: 0 0 12px; font-size: 16px; }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: right; color: var(--muted); font-weight: 500; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  .thumb { width: 44px; height: 44px; border-radius: 8px; background: #fafafb; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .thumb .ph { font-size: 22px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tools .input { flex: 1; min-width: 160px; }
  .acts { display: flex; gap: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 500px) { .grid2 { grid-template-columns: 1fr; } }
  .chk { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 14px; }
  .imgpick { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .imgpick .thumb { width: 70px; height: 70px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 10px; }
  .bars div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 11px; color: var(--muted); gap: 4px; }
  .bars i { display: block; width: 100%; max-width: 34px; background: var(--red); border-radius: 6px 6px 0 0; min-height: 2px; }
  .low { color: var(--red); font-weight: 700; }
  .ovl { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 44; display: none; }
  .ovl.on { display: block; }
</style>
</head>
<body>

<!-- تسجيل الدخول -->
<div class="login" id="login">
  <form class="box" onsubmit="doLogin(event)">
    <img src="logo.jpg" alt="ALAFA">
    <h2 style="margin:0 0 4px">لوحة التحكم</h2>
    <div id="loginFields"><p style="color:var(--muted);font-size:14px">جارٍ الاتصال...</p></div>
    <button class="btn block" style="margin-top:12px" id="loginBtn" disabled>دخول</button>
    <p id="loginMsg" style="font-size:12px;color:var(--muted);margin-top:14px"></p>
    <a href="index.html" style="font-size:13px;color:var(--red)">← العودة للمتجر</a>
  </form>
</div>

<div class="app" id="app">
  <div class="ovl" id="ovl" onclick="toggleMenu(false)"></div>
  <aside id="side">
    <img src="logo.jpg" alt="ALAFA">
    <button class="nav on" data-p="dash" onclick="show('dash')">📊 الرئيسية</button>
    <button class="nav" data-p="orders" onclick="show('orders')">📦 الطلبات <span class="badge" id="newBadge" hidden></span></button>
    <button class="nav" data-p="products" onclick="show('products')">💊 المنتجات</button>
    <button class="nav" data-p="cats" onclick="show('cats')">🗂️ الأقسام</button>
    <button class="nav" data-p="customers" onclick="show('customers')">👥 العملاء</button>
    <button class="nav" data-p="settings" onclick="show('settings')">⚙️ الإعدادات</button>
    <div class="grow"></div>
    <a class="btn light block" href="index.html" target="_blank" style="margin-bottom:8px">🛍️ عرض المتجر</a>
    <button class="btn ghost block" onclick="logout()">تسجيل الخروج</button>
  </aside>

  <div class="content">
    <div class="head">
      <button class="btn light sm menu-btn" onclick="toggleMenu(true)">☰</button>
      <h1 id="title">الرئيسية</h1>
      <div id="headAct"></div>
    </div>
    <div id="page"></div>
  </div>
</div>

<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

<script src="firebase-config.js"></script>
<script src="data.js"></script>
<script>
var A = ALAFA, db = A.db, esc = A.esc, money = A.money, cur = "dash", draftImg = null;
var TITLES = { dash: "الرئيسية", orders: "الطلبات", products: "المنتجات", cats: "الأقسام", customers: "العملاء", settings: "الإعدادات" };
var SCLS = { new: "", confirmed: "ok", shipping: "warn", delivered: "ok", cancelled: "gray" };

function toast(t) { var el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove("show"); }, 1800); }
function openModal(h) { document.getElementById("modalBody").innerHTML = h; document.getElementById("modal").classList.add("open"); }
function closeModal() { document.getElementById("modal").classList.remove("open"); }
function toggleMenu(on) { document.getElementById("side").classList.toggle("open", on); document.getElementById("ovl").classList.toggle("on", on); }
function fmtDate(d) { return new Date(d).toLocaleString("ar-LY", { dateStyle: "medium", timeStyle: "short" }); }

/* ---------- الدخول ---------- */
function renderLogin() {
  var fb = A.mode === "firebase";
  document.getElementById("loginFields").innerHTML = fb
    ? '<p style="color:var(--muted);margin:0 0 16px;font-size:14px">سجّل الدخول بحساب المدير</p>' +
      '<input class="input" id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="username" required style="margin-bottom:8px;direction:ltr;text-align:center">' +
      '<input class="input" id="pass" type="password" placeholder="كلمة المرور" autocomplete="current-password" required style="direction:ltr;text-align:center">'
    : '<p style="color:var(--muted);margin:0 0 16px;font-size:14px">أدخل الرمز السري للدخول</p>' +
      '<input class="input" id="pin" type="password" inputmode="numeric" placeholder="الرمز السري" style="text-align:center;font-size:20px;letter-spacing:6px" required>';
  var msg = document.getElementById("loginMsg");
  if (A.firebaseError && fb && !A.db.products.length) msg.innerHTML = '<span style="color:var(--red)">⚠️ ' + esc(A.firebaseError.message) + "</span>";
  else msg.textContent = fb ? "🔒 متصل بقاعدة بيانات Firebase" : "الوضع المحلي — الرمز الافتراضي: 1234، غيّره من الإعدادات";
  document.getElementById("loginBtn").disabled = false;
}
function doLogin(e) {
  e.preventDefault();
  var btn = document.getElementById("loginBtn"); btn.disabled = true;
  var p = A.mode === "firebase" ? A.login(document.getElementById("email").value, document.getElementById("pass").value) : A.login(document.getElementById("pin").value);
  p.then(function () { btn.disabled = false; })
   .catch(function (err) {
     btn.disabled = false;
     if (err.code === "not-admin") document.getElementById("loginMsg").innerHTML = '<span style="color:var(--red)">' + esc(err.message) + "</span>";
     else toast(err.message);
   });
}
var entered = false;
function syncAuth() {
  if (A.isAdmin && !entered) {
    entered = true;
    document.getElementById("login").style.display = "none"; document.getElementById("app").classList.add("on"); show(cur);
  } else if (!A.isAdmin && entered) { location.reload(); }
}
function logout() { A.logout().then(function () { location.reload(); }); }

/* خطأ موحّد لعمليات الحفظ */
function fail(err) { toast((err && err.message) || "تعذر الحفظ"); }

/* إعادة رسم الصفحة الحالية عند تغيّر البيانات دون مقاطعة ما يكتبه المدير */
function refresh() {
  if (!entered) return;
  updateBadge();
  var a = document.activeElement, typing = a && document.getElementById("page").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if (cur === "orders" && document.getElementById("otbl")) return pOrdersTable();
  if (cur === "products" && document.getElementById("ptbl")) return pProductsTable();
  if (cur === "settings" || typing) return;
  show(cur, true);
}
function updateBadge() {
  var n = db.orders.filter(function (o) { return o.status === "new"; }).length, nb = document.getElementById("newBadge");
  nb.hidden = !n; nb.textContent = n;
}

function show(p, keepMenu) {
  cur = p; db = A.db; if (!keepMenu) toggleMenu(false);
  document.querySelectorAll("aside .nav").forEach(function (b) { b.classList.toggle("on", b.dataset.p === p); });
  document.getElementById("title").textContent = TITLES[p];
  document.getElementById("headAct").innerHTML = "";
  updateBadge();
  ({ dash: pDash, orders: pOrders, products: pProducts, cats: pCats, customers: pCustomers, settings: pSettings })[p]();
}
function setPage(h) { document.getElementById("page").innerHTML = h; }

/* ---------- لوحة المعلومات ---------- */
function pDash() {
  var valid = db.orders.filter(function (o) { return o.status !== "cancelled"; });
  var revenue = valid.reduce(function (s, o) { return s + o.total; }, 0);
  var today = new Date().toDateString();
  var todayN = db.orders.filter(function (o) { return new Date(o.date).toDateString() === today; }).length;
  var low = db.products.filter(function (p) { return p.stock <= 10; });

  var days = [];
  for (var i = 6; i >= 0; i--) {
    var d = new Date(); d.setDate(d.getDate() - i);
    var sum = valid.filter(function (o) { return new Date(o.date).toDateString() === d.toDateString(); }).reduce(function (s, o) { return s + o.total; }, 0);
    days.push({ l: d.toLocaleDateString("ar-LY", { weekday: "short" }), v: sum });
  }
  var mx = Math.max.apply(null, days.map(function (x) { return x.v; })) || 1;

  var sold = {};
  valid.forEach(function (o) { o.items.forEach(function (it) { sold[it.name] = (sold[it.name] || 0) + it.qty; }); });
  var top = Object.keys(sold).sort(function (a, b) { return sold[b] - sold[a]; }).slice(0, 5);

  var empty = !db.products.length && !db.categories.length;
  setPage(
    (empty ? '<div class="panel" style="border:2px dashed var(--red)"><h3>🚀 قاعدة البيانات فارغة</h3><p style="font-size:14px;color:var(--muted)">ابدأ بإضافة الأقسام والمنتجات، أو حمّل المنتجات التجريبية للتجربة.</p><button class="btn" onclick="seed()">تحميل المنتجات التجريبية</button></div>' : "") +
    '<div class="stats">' +
    '<div class="stat red"><small>إجمالي المبيعات</small><b>' + money(revenue) + "</b></div>" +
    '<div class="stat"><small>عدد الطلبات</small><b>' + db.orders.length + "</b></div>" +
    '<div class="stat"><small>طلبات اليوم</small><b>' + todayN + "</b></div>" +
    '<div class="stat"><small>المنتجات</small><b>' + db.products.length + "</b></div>" +
    '<div class="stat"><small>مخزون منخفض</small><b class="' + (low.length ? "low" : "") + '">' + low.length + "</b></div></div>" +
    '<div class="panel"><h3>المبيعات آخر 7 أيام</h3><div class="bars">' + days.map(function (x) {
      return '<div><span>' + (x.v ? Math.round(x.v) : "") + '</span><i style="height:' + (x.v / mx * 100) + '%"></i>' + x.l + "</div>";
    }).join("") + "</div></div>" +
    '<div class="grid2"><div class="panel"><h3>أحدث الطلبات</h3>' + (db.orders.length ? '<table>' + db.orders.slice(0, 5).map(function (o) {
      return '<tr style="cursor:pointer" onclick="viewOrder(\'' + o.id + '\')"><td><b>' + esc(o.code || o.id) + "</b><br><small>" + esc(o.customer.name) + '</small></td><td><span class="badge ' + SCLS[o.status] + '">' + A.STATUSES[o.status] + "</span></td><td>" + money(o.total) + "</td></tr>";
    }).join("") + "</table>" : '<div class="empty">لا توجد طلبات بعد</div>') + "</div>" +
    '<div class="panel"><h3>تنبيهات المخزون</h3>' + (low.length ? "<table>" + low.map(function (p) {
      return '<tr><td>' + esc(p.name) + '</td><td class="low">' + p.stock + '</td><td><button class="btn sm light" onclick="editProduct(\'' + p.id + '\')">تحديث</button></td></tr>';
    }).join("") + "</table>" : '<div class="empty">✓ كل المنتجات متوفرة</div>') +
    (top.length ? '<h3 style="margin-top:16px">الأكثر مبيعاً</h3><table>' + top.map(function (n) { return "<tr><td>" + esc(n) + "</td><td>" + sold[n] + "</td></tr>"; }).join("") + "</table>" : "") +
    "</div></div>"
  );
}

/* ---------- الطلبات ---------- */
var oFilter = "", oQ = "";
function pOrders() {
  var opts = '<option value="">كل الحالات</option>' + Object.keys(A.STATUSES).map(function (k) { return '<option value="' + k + '"' + (oFilter === k ? " selected" : "") + ">" + A.STATUSES[k] + "</option>"; }).join("");
  document.getElementById("headAct").innerHTML = '<button class="btn light sm" onclick="exportOrders()">⬇️ تصدير CSV</button>';
  var list = db.orders.filter(function (o) {
    if (oFilter && o.status !== oFilter) return false;
    if (oQ && ((o.code || o.id) + o.customer.name + o.customer.phone + o.customer.city).toLowerCase().indexOf(oQ.toLowerCase()) < 0) return false;
    return true;
  });
  setPage('<div class="panel"><div class="tools"><input class="input" placeholder="بحث برقم الطلب، الاسم، الهاتف..." value="' + esc(oQ) + '" oninput="oQ=this.value;pOrdersTable()"><select class="input" style="max-width:180px" onchange="oFilter=this.value;pOrders()">' + opts + "</select></div>" +
    '<div class="tbl-wrap" id="otbl"></div></div>');
  pOrdersTable();
}
function pOrdersTable() {
  var list = db.orders.filter(function (o) {
    if (oFilter && o.status !== oFilter) return false;
    if (oQ && ((o.code || o.id) + o.customer.name + o.customer.phone + o.customer.city).toLowerCase().indexOf(oQ.toLowerCase()) < 0) return false;
    return true;
  });
  document.getElementById("otbl").innerHTML = list.length ? "<table><tr><th>الطلب</th><th>العميل</th><th>المدينة</th><th>التاريخ</th><th>الإجمالي</th><th>الحالة</th><th></th></tr>" + list.map(function (o) {
    return "<tr><td><b>" + esc(o.code || o.id) + "</b></td><td>" + esc(o.customer.name) + "<br><small>" + esc(o.customer.phone) + "</small></td><td>" + esc(o.customer.city) + "</td><td><small>" + fmtDate(o.date) + "</small></td><td>" + money(o.total) +
      '</td><td><span class="badge ' + SCLS[o.status] + '">' + A.STATUSES[o.status] + '</span></td><td><button class="btn sm light" onclick="viewOrder(\'' + o.id + '\')">عرض</button></td></tr>';
  }).join("") + "</table>" : '<div class="empty">لا توجد طلبات</div>';
}
function viewOrder(id) {
  var o = db.orders.find(function (x) { return x.id === id; }); if (!o) return;
  var c = o.customer;
  openModal("<h3>طلب " + esc(o.code || o.id) + "</h3>" +
    '<div style="font-size:14px;color:var(--muted);margin-bottom:10px">' + fmtDate(o.date) + "</div>" +
    '<div class="panel" style="box-shadow:none;background:var(--bg)"><b>' + esc(c.name) + "</b> (" + esc(c.type || "") + ")<br>📞 " + esc(c.phone) + "<br>📍 " + esc(c.city) + " — " + esc(c.address) + "<br>💳 " + esc(c.pay || "") + (c.notes ? "<br>📝 " + esc(c.notes) : "") + "</div>" +
    "<table>" + o.items.map(function (i) { return "<tr><td>" + esc(i.name) + "</td><td>× " + i.qty + "</td><td>" + money(i.price * i.qty) + "</td></tr>"; }).join("") +
    "<tr><td colspan=2>التوصيل</td><td>" + money(o.delivery) + "</td></tr><tr><td colspan=2><b>الإجمالي</b></td><td><b class='price'>" + money(o.total) + "</b></td></tr></table>" +
    '<label class="f" style="margin-top:14px">تغيير الحالة<select class="input" onchange="setStatus(\'' + o.id + '\',this.value)">' +
    Object.keys(A.STATUSES).map(function (k) { return '<option value="' + k + '"' + (o.status === k ? " selected" : "") + ">" + A.STATUSES[k] + "</option>"; }).join("") + "</select></label>" +
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/' + esc(String(c.phone).replace(/\D/g, "")) + '">💬 واتساب العميل</a>' +
    '<button class="btn light" onclick="printOrder(\'' + o.id + '\')">🖨️ طباعة فاتورة</button>' +
    '<button class="btn ghost" onclick="delOrder(\'' + o.id + '\')">حذف</button>' +
    '<button class="btn light" onclick="closeModal()">إغلاق</button></div>');
}
function setStatus(id, s) {
  A.setOrderStatus(id, s).then(function () { toast("تم تحديث الحالة"); }).catch(fail);
}
function delOrder(id) {
  if (!confirm("حذف هذا الطلب نهائياً؟")) return;
  A.deleteOrder(id).then(closeModal).catch(fail);
}
function printOrder(id) {
  var o = db.orders.find(function (x) { return x.id === id; }), s = db.settings, w = window.open("", "_blank");
  if (!w) { toast("اسمح بالنوافذ المنبثقة للطباعة"); return; }
  w.document.write('<html dir="rtl"><head><meta charset="utf-8"><title>فاتورة ' + esc(o.code || o.id) + '</title><style>body{font-family:Tahoma;padding:30px;color:#222}table{width:100%;border-collapse:collapse;margin-top:16px}td,th{border:1px solid #ddd;padding:8px;text-align:right}h1{color:#e31e24;margin:0}.h{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #e31e24;padding-bottom:12px}</style></head><body>' +
    '<div class="h"><div><h1>ALAFA HEALTHCARE</h1><div>' + esc(s.nameAr) + "<br>" + esc(s.address) + " · " + esc(s.phone) + '</div></div><img src="' + location.href.replace(/admin\.html.*$/, "logo.jpg") + '" width="110"></div>' +
    "<h2>فاتورة رقم " + esc(o.code || o.id) + "</h2><div>التاريخ: " + fmtDate(o.date) + "<br>العميل: " + esc(o.customer.name) + " — " + esc(o.customer.phone) + "<br>العنوان: " + esc(o.customer.city) + "، " + esc(o.customer.address) + "</div>" +
    "<table><tr><th>المنتج</th><th>السعر</th><th>الكمية</th><th>المجموع</th></tr>" + o.items.map(function (i) { return "<tr><td>" + esc(i.name) + "</td><td>" + money(i.price) + "</td><td>" + i.qty + "</td><td>" + money(i.price * i.qty) + "</td></tr>"; }).join("") +
    "<tr><td colspan=3>التوصيل</td><td>" + money(o.delivery) + "</td></tr><tr><th colspan=3>الإجمالي</th><th>" + money(o.total) + "</th></tr></table>" +
    "<p style='margin-top:30px;text-align:center;color:#888'>شكراً لثقتكم بشركة ألفا الطبية</p><script>onload=function(){print()}<\/script></body></html>");
  w.document.close();
}
function exportOrders() {
  var rows = [["رقم الطلب", "التاريخ", "العميل", "الهاتف", "المدينة", "العنوان", "المنتجات", "الإجمالي", "الحالة"]];
  db.orders.forEach(function (o) {
    rows.push([o.code || o.id, fmtDate(o.date), o.customer.name, o.customer.phone, o.customer.city, o.customer.address, o.items.map(function (i) { return i.name + " x" + i.qty; }).join(" | "), o.total, A.STATUSES[o.status]]);
  });
  download("alafa-orders.csv", "﻿" + rows.map(function (r) { return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(","); }).join("\n"), "text/csv");
}
function download(name, text, type) {
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: type + ";charset=utf-8" })); a.download = name; a.click();
}

/* ---------- المنتجات ---------- */
var pQ = "";
function pProducts() {
  document.getElementById("headAct").innerHTML = '<button class="btn" onclick="editProduct()">+ منتج جديد</button>';
  setPage('<div class="panel"><div class="tools"><input class="input" placeholder="بحث عن منتج..." value="' + esc(pQ) + '" oninput="pQ=this.value;pProductsTable()"></div><div class="tbl-wrap" id="ptbl"></div></div>');
  pProductsTable();
}
function pProductsTable() {
  var list = db.products.filter(function (p) { return !pQ || (p.name + p.brand).toLowerCase().indexOf(pQ.toLowerCase()) >= 0; });
  document.getElementById("ptbl").innerHTML = list.length ? "<table><tr><th></th><th>المنتج</th><th>القسم</th><th>السعر</th><th>المخزون</th><th>الحالة</th><th></th></tr>" + list.map(function (p) {
    return '<tr><td><div class="thumb">' + A.productImg(p) + "</div></td><td><b>" + esc(p.name) + "</b><br><small>" + esc(p.brand) + " · " + esc(p.unit) + "</small>" + (p.rx ? ' <span class="badge warn">بوصفة</span>' : "") + (p.featured ? ' <span class="badge">مميز</span>' : "") +
      "</td><td>" + esc(A.catName(p.cat)) + "</td><td>" + money(p.price) + '</td><td class="' + (p.stock <= 10 ? "low" : "") + '">' + p.stock + "</td><td>" +
      (p.active !== false ? '<span class="badge ok">ظاهر</span>' : '<span class="badge gray">مخفي</span>') +
      '</td><td><div class="acts"><button class="btn sm light" onclick="editProduct(\'' + p.id + '\')">تعديل</button><button class="btn sm ghost" onclick="delProduct(\'' + p.id + '\')">حذف</button></div></td></tr>';
  }).join("") + "</table>" : '<div class="empty">لا توجد منتجات</div>';
}
function editProduct(id) {
  var p = id ? db.products.find(function (x) { return x.id === id; }) : { name: "", brand: "", cat: (db.categories[0] || {}).id, price: "", oldPrice: "", stock: "", unit: "", desc: "", rx: false, featured: false, img: "", active: true };
  draftImg = p.img || "";
  openModal("<h3>" + (id ? "تعديل منتج" : "منتج جديد") + '</h3><form onsubmit="saveProduct(event,\'' + (id || "") + '\')">' +
    '<div class="imgpick"><div class="thumb" id="imgPrev">' + A.productImg(p) + '</div><div><input type="file" accept="image/*" id="imgFile" onchange="pickImg(this)" hidden><button type="button" class="btn sm light" onclick="document.getElementById(\'imgFile\').click()">📷 رفع صورة</button> <button type="button" class="btn sm ghost" onclick="draftImg=\'\';document.getElementById(\'imgPrev\').innerHTML=\'<span class=ph>💊</span>\'">إزالة</button></div></div>' +
    '<label class="f">اسم المنتج<input class="input" name="name" required value="' + esc(p.name) + '"></label>' +
    '<div class="grid2"><label class="f">الشركة المصنعة / الماركة<input class="input" name="brand" value="' + esc(p.brand) + '"></label>' +
    '<label class="f">القسم<select class="input" name="cat">' + db.categories.map(function (c) { return '<option value="' + c.id + '"' + (c.id === p.cat ? " selected" : "") + ">" + esc(c.name) + "</option>"; }).join("") + "</select></label>" +
    '<label class="f">السعر<input class="input" name="price" type="number" step="0.01" min="0" required value="' + esc(p.price) + '"></label>' +
    '<label class="f">السعر قبل الخصم (اختياري)<input class="input" name="oldPrice" type="number" step="0.01" min="0" value="' + esc(p.oldPrice || "") + '"></label>' +
    '<label class="f">الكمية في المخزون<input class="input" name="stock" type="number" min="0" required value="' + esc(p.stock) + '"></label>' +
    '<label class="f">العبوة / الوحدة<input class="input" name="unit" placeholder="مثال: علبة 20 قرص" value="' + esc(p.unit) + '"></label></div>' +
    '<label class="f">الوصف<textarea class="input" name="desc" rows="3">' + esc(p.desc) + "</textarea></label>" +
    '<label class="chk"><input type="checkbox" name="rx"' + (p.rx ? " checked" : "") + "> يُصرف بوصفة طبية</label>" +
    '<label class="chk"><input type="checkbox" name="featured"' + (p.featured ? " checked" : "") + "> منتج مميز (يظهر أولاً)</label>" +
    '<label class="chk"><input type="checkbox" name="active"' + (p.active !== false ? " checked" : "") + "> ظاهر في المتجر</label>" +
    '<div style="display:flex;gap:8px"><button class="btn block">حفظ</button><button type="button" class="btn light" onclick="closeModal()">إلغاء</button></div></form>');
}
function pickImg(inp) {
  if (!inp.files[0]) return;
  A.readImage(inp.files[0]).then(function (d) { draftImg = d; document.getElementById("imgPrev").innerHTML = '<img src="' + d + '">'; }).catch(function () { toast("تعذر قراءة الصورة"); });
}
function saveProduct(e, id) {
  e.preventDefault();
  var f = e.target;
  var data = {
    name: f.name.value.trim(), brand: f.brand.value.trim(), cat: f.cat.value,
    price: Number(f.price.value), oldPrice: Number(f.oldPrice.value || 0), stock: parseInt(f.stock.value, 10) || 0,
    unit: f.unit.value.trim(), desc: f.desc.value.trim(), rx: f.rx.checked, featured: f.featured.checked, active: f.active.checked, img: draftImg
  };
  if (id) { var old = db.products.find(function (x) { return x.id === id; }); data.id = id; data.created = old && old.created; }
  var btn = f.querySelector("button.block"); btn.disabled = true;
  A.saveProduct(data).then(function () { closeModal(); toast("تم الحفظ ✓"); }).catch(function (err) { btn.disabled = false; fail(err); });
}
function delProduct(id) {
  if (!confirm("حذف هذا المنتج؟")) return;
  A.deleteProduct(id).catch(fail);
}

/* ---------- الأقسام ---------- */
function pCats() {
  document.getElementById("headAct").innerHTML = '<button class="btn" onclick="editCat()">+ قسم جديد</button>';
  setPage('<div class="panel">' + (db.categories.length ? "<table><tr><th>الأيقونة</th><th>القسم</th><th>عدد المنتجات</th><th></th></tr>" + db.categories.map(function (c) {
    var n = db.products.filter(function (p) { return p.cat === c.id; }).length;
    return '<tr><td style="font-size:24px">' + esc(c.icon) + "</td><td><b>" + esc(c.name) + "</b></td><td>" + n + '</td><td><div class="acts"><button class="btn sm light" onclick="editCat(\'' + c.id + '\')">تعديل</button><button class="btn sm ghost" onclick="delCat(\'' + c.id + '\')">حذف</button></div></td></tr>';
  }).join("") + "</table>" : '<div class="empty">لا توجد أقسام</div>') + "</div>");
}
function editCat(id) {
  var c = id ? db.categories.find(function (x) { return x.id === id; }) : { name: "", icon: "💊" };
  openModal("<h3>" + (id ? "تعديل قسم" : "قسم جديد") + '</h3><form onsubmit="saveCat(event,\'' + (id || "") + '\')">' +
    '<label class="f">اسم القسم<input class="input" name="name" required value="' + esc(c.name) + '"></label>' +
    '<label class="f">أيقونة (إيموجي)<input class="input" name="icon" maxlength="4" value="' + esc(c.icon) + '"></label>' +
    '<div style="display:flex;gap:8px"><button class="btn block">حفظ</button><button type="button" class="btn light" onclick="closeModal()">إلغاء</button></div></form>');
}
function saveCat(e, id) {
  e.preventDefault();
  var d = { name: e.target.name.value.trim(), icon: e.target.icon.value.trim() || "💊" };
  if (id) { var old = db.categories.find(function (x) { return x.id === id; }); d.id = id; d.sort = old && old.sort; }
  A.saveCategory(d).then(closeModal).catch(fail);
}
function delCat(id) {
  if (db.products.some(function (p) { return p.cat === id; })) { toast("انقل منتجات القسم أولاً"); return; }
  if (!confirm("حذف القسم؟")) return;
  A.deleteCategory(id).catch(fail);
}

/* ---------- العملاء ---------- */
function pCustomers() {
  var map = {};
  db.orders.forEach(function (o) {
    var k = o.customer.phone, m = map[k] || (map[k] = { name: o.customer.name, phone: k, city: o.customer.city, type: o.customer.type, n: 0, total: 0, last: o.date });
    m.n++; if (o.status !== "cancelled") m.total += o.total; if (o.date > m.last) m.last = o.date;
  });
  var list = Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return b.total - a.total; });
  setPage('<div class="panel"><div class="tbl-wrap">' + (list.length ? "<table><tr><th>العميل</th><th>النوع</th><th>المدينة</th><th>الطلبات</th><th>إجمالي المشتريات</th><th>آخر طلب</th><th></th></tr>" + list.map(function (c) {
    return "<tr><td><b>" + esc(c.name) + "</b><br><small>" + esc(c.phone) + "</small></td><td>" + esc(c.type || "") + "</td><td>" + esc(c.city) + "</td><td>" + c.n + "</td><td>" + money(c.total) + "</td><td><small>" + fmtDate(c.last) + '</small></td><td><a class="btn sm light" target="_blank" rel="noopener" href="https://wa.me/' + esc(String(c.phone).replace(/\D/g, "")) + '">💬</a></td></tr>';
  }).join("") + "</table>" : '<div class="empty">سيظهر العملاء هنا بعد أول طلب</div>') + "</div></div>");
}

/* ---------- الإعدادات ---------- */
function pSettings() {
  var s = db.settings, fb = A.mode === "firebase";
  function fld(k, l, t) { return '<label class="f">' + l + '<input class="input" name="' + k + '" type="' + (t || "text") + '" value="' + esc(s[k]) + '"></label>'; }
  setPage('<form class="panel" onsubmit="saveSettings(event)"><h3>بيانات الشركة</h3><div class="grid2">' +
    fld("name", "الاسم (إنجليزي)") + fld("nameAr", "الاسم (عربي)") + fld("tagline", "الشعار / الوصف") + fld("address", "العنوان") +
    fld("phone", "الهاتف") + fld("email", "البريد الإلكتروني", "email") + fld("whatsapp", "رقم واتساب لاستقبال الطلبات (بالصيغة الدولية بدون +)") + fld("currency", "العملة") +
    "</div><h3>التوصيل والعروض</h3><div class=grid2>" + fld("deliveryFee", "رسوم التوصيل", "number") + fld("freeDeliveryOver", "توصيل مجاني للطلبات فوق", "number") + "</div>" +
    fld("announcement", "شريط الإعلان أعلى المتجر") +
    (fb ? "" : "<h3>الأمان</h3>" + fld("adminPin", "الرمز السري للوحة التحكم", "password")) +
    '<button class="btn">حفظ الإعدادات</button></form>' +
    '<div class="panel"><h3>قاعدة البيانات</h3>' +
    (fb ? '<p style="font-size:14px">🟢 متصل بـ Firebase — المشروع: <b dir="ltr">' + esc(ALAFA_FIREBASE.projectId) + '</b><br>المدير الحالي: <span dir="ltr">' + esc(A.adminEmail) + "</span></p>" +
          '<p style="font-size:13px;color:var(--muted)">لإضافة مدير جديد: أنشئ له حساباً في Authentication، ثم أضف مستنداً بمعرّفه (UID) داخل مجموعة admins في Firestore.</p>'
        : '<p style="font-size:14px;color:var(--muted)">⚪ الوضع المحلي — البيانات محفوظة في هذا المتصفح فقط. لربط المتجر بـ Firebase املأ ملف firebase-config.js (راجع README).</p>') +
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn light" onclick="backup()">⬇️ تصدير نسخة احتياطية</button>' +
    '<input type="file" accept="application/json" id="rf" hidden onchange="restore(this)"><button class="btn light" onclick="document.getElementById(\'rf\').click()">⬆️ استعادة / نقل البيانات</button>' +
    (fb ? '<button class="btn ghost" onclick="seed()">تحميل المنتجات التجريبية</button>' : '<button class="btn ghost" onclick="resetAll()">إعادة ضبط البيانات</button>') +
    "</div>" + (fb ? "" : '<p style="font-size:12px;color:var(--muted);margin-bottom:0">لنقل بياناتك الحالية إلى Firebase: صدّر نسخة احتياطية الآن، ثم بعد الربط استخدم «استعادة / نقل البيانات».</p>') + "</div>");
}
function saveSettings(e) {
  e.preventDefault();
  var f = e.target, d = {};
  Object.keys(A.DEFAULT.settings).forEach(function (k) {
    if (f[k]) d[k] = f[k].type === "number" ? Number(f[k].value) : f[k].value.trim();
  });
  if (d.whatsapp != null) d.whatsapp = String(d.whatsapp).replace(/\D/g, "");
  if (A.mode === "local" && !d.adminPin) d.adminPin = "1234";
  A.saveSettings(d).then(function () { toast("تم حفظ الإعدادات ✓"); }).catch(fail);
}
function backup() { download("alafa-backup-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(db, null, 2), "application/json"); }
function restore(inp) {
  var file = inp.files[0]; inp.value = ""; if (!file) return;
  var r = new FileReader();
  r.onload = function () {
    var d;
    try { d = JSON.parse(r.result); if (!d.products || !d.settings) throw 0; } catch (x) { toast("ملف غير صالح"); return; }
    if (!confirm("سيتم استيراد " + d.products.length + " منتج و" + (d.orders || []).length + " طلب. متابعة؟")) return;
    A.importAll(d).then(function () { toast("تمت الاستعادة ✓"); show(cur); }).catch(fail);
  };
  r.readAsText(file);
}
function seed() {
  if (!confirm("إضافة الأقسام والمنتجات التجريبية إلى قاعدة البيانات؟")) return;
  A.seedDemo().then(function () { toast("تمت الإضافة ✓"); show(cur); }).catch(fail);
}
function resetAll() { if (confirm("سيتم حذف جميع البيانات وإرجاع المنتجات التجريبية. متأكد؟")) A.resetLocal(); }

/* ---------- التشغيل ---------- */
A.onChange(function () {
  db = A.db;
  if (!A.loaded) return;
  if (!entered) renderLogin();
  syncAuth();
  refresh();
});
</script>
