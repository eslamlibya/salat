<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALAFA — شركة ألفا الطبية</title>
<meta name="description" content="متجر شركة ألفا الطبية لاستيراد وتسويق الأدوية والمستلزمات الطبية">
<meta name="theme-color" content="#e31e24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  header.top {
    position: sticky; top: 0; z-index: 20; background: #fff;
    border-bottom: 1px solid var(--line); padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
  }
  .bar { display: flex; align-items: center; gap: 10px; max-width: 1100px; margin: auto; }
  .logo { height: 40px; width: auto; }
  .brand b { display: block; color: var(--red); font-size: 18px; line-height: 1.1; letter-spacing: .5px; }
  .brand small { color: var(--muted); font-size: 12px; }
  .bar .sp { flex: 1; }
  .cart-btn { position: relative; background: var(--red-l); color: var(--red); border: 0; width: 44px; height: 44px; border-radius: 12px; font-size: 20px; cursor: pointer; }
  .cart-btn i { position: absolute; top: -4px; left: -4px; background: var(--red); color: #fff; font-style: normal; font-size: 11px; min-width: 20px; height: 20px; border-radius: 99px; display: grid; place-items: center; font-weight: 700; }
  .search { max-width: 1100px; margin: 10px auto 0; position: relative; }
  .search input { padding-right: 38px; background: var(--bg); border-color: transparent; }
  .search::before { content: "🔍"; position: absolute; right: 12px; top: 9px; opacity: .5; }

  .announce { background: var(--red); color: #fff; text-align: center; font-size: 13px; padding: 6px 12px; }
  main { max-width: 1100px; margin: auto; padding: 16px; padding-bottom: 90px; }

  .hero {
    background: linear-gradient(135deg, var(--red), #ff5a5f); color: #fff;
    border-radius: 20px; padding: 22px 20px; display: flex; align-items: center; gap: 16px; overflow: hidden;
  }
  .hero h1 { margin: 0 0 6px; font-size: 22px; }
  .hero p { margin: 0 0 12px; opacity: .92; font-size: 14px; }
  .hero .btn { background: #fff; color: var(--red); }
  .hero .heart { font-size: 70px; flex-shrink: 0; filter: drop-shadow(0 6px 12px rgba(0,0,0,.15)); }

  h2.sec { font-size: 18px; margin: 22px 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .cats { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cat {
    flex-shrink: 0; border: 1.5px solid var(--line); background: #fff; border-radius: 99px;
    padding: 8px 14px; cursor: pointer; font-weight: 500; font-size: 14px; white-space: nowrap;
  }
  .cat.on { background: var(--red); border-color: var(--red); color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; }
  .card .im { aspect-ratio: 1; background: #fafafb; position: relative; }
  .card .im img { width: 100%; height: 100%; object-fit: contain; }
  .card .im .badge { position: absolute; top: 8px; right: 8px; }
  .card .bd { padding: 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .card .nm { font-weight: 700; font-size: 14px; line-height: 1.35; }
  .card .un { font-size: 12px; color: var(--muted); }
  .card .pr { margin-top: auto; padding-top: 6px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .price { color: var(--red); font-weight: 800; }
  .old { color: var(--muted); text-decoration: line-through; font-size: 12px; margin-inline-start: 4px; }
  .add { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--red); color: #fff; font-size: 20px; cursor: pointer; flex-shrink: 0; }
  .add:disabled { background: #ccc; }

  .drawer { position: fixed; inset: 0; z-index: 40; display: none; }
  .drawer.open { display: block; }
  .drawer .bgc { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
  .drawer .pane { position: absolute; top: 0; bottom: 0; left: 0; width: min(420px, 100%); background: #fff; display: flex; flex-direction: column; }
  .pane header { padding: 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .pane header h3 { margin: 0; }
  .pane .list { flex: 1; overflow: auto; padding: 8px 16px; }
  .pane footer { padding: 16px; border-top: 1px solid var(--line); padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .x { border: 0; background: #f0f0f3; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; font-size: 18px; }
  .ci { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .ci .im { width: 58px; height: 58px; border-radius: 10px; background: #fafafb; overflow: hidden; flex-shrink: 0; }
  .ci .im img { width: 100%; height: 100%; object-fit: contain; }
  .ci .im .ph { font-size: 26px; }
  .ci .info { flex: 1; min-width: 0; }
  .ci .info b { font-size: 14px; display: block; }
  .qty { display: flex; align-items: center; gap: 6px; }
  .qty button { width: 28px; height: 28px; border-radius: 8px; border: 0; background: #f0f0f3; cursor: pointer; font-weight: 700; }
  .row { display: flex; justify-content: space-between; margin: 4px 0; font-size: 14px; }
  .row.total { font-size: 17px; font-weight: 800; }

  .pd .im { aspect-ratio: 1.3; background: #fafafb; border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
  .pd .im img { width: 100%; height: 100%; object-fit: contain; }
  .pd .im .ph { font-size: 90px; }
  .rx-note { background: #fdf3e2; color: #92400e; padding: 8px 12px; border-radius: 10px; font-size: 13px; margin: 8px 0; }

  footer.site { background: #fff; border-top: 1px solid var(--line); padding: 24px 16px; text-align: center; color: var(--muted); font-size: 14px; }
  footer.site img { width: 120px; margin: 0 auto 8px; }
  footer.site a.adm { color: var(--muted); font-size: 12px; opacity: .6; }

  .tabs { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--line); display: flex; z-index: 30; padding-bottom: env(safe-area-inset-bottom); }
  .tabs button { flex: 1; border: 0; background: none; padding: 8px 0 6px; font-size: 11px; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tabs button span { font-size: 20px; }
  .tabs button.on { color: var(--red); font-weight: 700; }
  @media (min-width: 900px) { .tabs { display: none; } main { padding-bottom: 30px; } }
  .ord { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="announce" id="announce"></div>
<header class="top">
  <div class="bar">
    <img class="logo" src="logo.jpg" alt="ALAFA">
    <div class="brand" hidden><b>ALAFA</b><small id="nameAr">شركة ألفا الطبية</small></div>
    <div class="sp"></div>
    <button class="cart-btn" onclick="openCart()" aria-label="السلة">🛒<i id="cartCount">0</i></button>
  </div>
  <div class="search"><input class="input" id="q" placeholder="ابحث عن دواء، ماركة أو منتج..." oninput="renderProducts()"></div>
</header>

<main id="main">
  <section id="home">
    <div class="hero">
      <div>
        <h1>صحتك أولويتنا ❤️</h1>
        <p id="tagline"></p>
        <a class="btn" href="#products" onclick="setCat('')">تسوّق الآن</a>
      </div>
      <div class="heart">💊</div>
    </div>

    <h2 class="sec">الأقسام</h2>
    <div class="cats" id="cats"></div>

    <h2 class="sec" id="products"><span id="listTitle">كل المنتجات</span><small id="resCount" style="color:var(--muted);font-weight:400;font-size:13px"></small></h2>
    <div class="grid" id="grid"></div>
  </section>

  <section id="ordersView" hidden>
    <h2 class="sec">طلباتي</h2>
    <div id="myOrders"></div>
  </section>

  <section id="contactView" hidden>
    <h2 class="sec">تواصل معنا</h2>
    <div class="ord" id="contactBox"></div>
  </section>
</main>

<footer class="site">
  <img src="logo.jpg" alt="ALAFA HEALTHCARE">
  <div id="footInfo"></div>
  <div style="margin-top:8px">© <span id="yr"></span> ALAFA HEALTHCARE — جميع الحقوق محفوظة</div>
  <a class="adm" href="admin.html">لوحة التحكم</a>
</footer>

<nav class="tabs">
  <button class="on" data-v="home" onclick="go('home')"><span>🏠</span>الرئيسية</button>
  <button onclick="openCart()"><span>🛒</span>السلة</button>
  <button data-v="ordersView" onclick="go('ordersView')"><span>📦</span>طلباتي</button>
  <button data-v="contactView" onclick="go('contactView')"><span>📞</span>تواصل</button>
</nav>

<!-- السلة -->
<div class="drawer" id="cart">
  <div class="bgc" onclick="closeCart()"></div>
  <div class="pane">
    <header><h3>سلة المشتريات</h3><button class="x" onclick="closeCart()">✕</button></header>
    <div class="list" id="cartList"></div>
    <footer id="cartFoot"></footer>
  </div>
</div>

<!-- تفاصيل المنتج / الدفع -->
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
var A = ALAFA, db = A.db, esc = A.esc, money = A.money;
var CART_KEY = "alafa-cart", MY_KEY = "alafa-my-orders";
var cart = readLS(CART_KEY, {}), curCat = "";

function readLS(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
function writeLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function toast(t) { var el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove("show"); }, 1800); }
function prod(id) { return db.products.find(function (p) { return p.id === id; }); }
function active() { return db.products.filter(function (p) { return p.active !== false; }); }

function renderInfo() {
  var s = db.settings;
  document.getElementById("announce").textContent = s.announcement || "";
  document.getElementById("announce").hidden = !s.announcement;
  document.getElementById("nameAr").textContent = s.nameAr;
  document.getElementById("tagline").textContent = s.tagline;
  document.getElementById("yr").textContent = new Date().getFullYear();
  document.getElementById("footInfo").innerHTML = esc(s.address) + " · " + esc(s.phone) + " · " + esc(s.email);
  document.getElementById("contactBox").innerHTML =
    '<p><b>' + esc(s.nameAr) + '</b><br>' + esc(s.tagline) + '</p>' +
    '<p>📍 ' + esc(s.address) + '<br>📞 <a href="tel:' + esc(s.phone) + '">' + esc(s.phone) + '</a><br>✉️ <a href="mailto:' + esc(s.email) + '">' + esc(s.email) + '</a></p>' +
    '<a class="btn block" target="_blank" rel="noopener" href="https://wa.me/' + esc(s.whatsapp) + '">💬 راسلنا على واتساب</a>' +
    '<p style="font-size:13px;color:var(--muted);margin-top:12px">للصيدليات والموزعين: تواصلوا معنا للحصول على أسعار الجملة وقوائم المنتجات المستوردة.</p>';
}

function renderCats() {
  var h = '<button class="cat' + (curCat === "" ? " on" : "") + '" onclick="setCat(\'\')">الكل</button>';
  h += '<button class="cat' + (curCat === "offers" ? " on" : "") + '" onclick="setCat(\'offers\')">🔥 العروض</button>';
  db.categories.forEach(function (c) {
    h += '<button class="cat' + (curCat === c.id ? " on" : "") + '" onclick="setCat(\'' + c.id + '\')">' + esc(c.icon) + " " + esc(c.name) + "</button>";
  });
  document.getElementById("cats").innerHTML = h;
}

function setCat(c) { curCat = c; renderCats(); renderProducts(); go("home"); }

function renderProducts() {
  var q = document.getElementById("q").value.trim().toLowerCase();
  if (q) go("home");
  var list = active().filter(function (p) {
    if (curCat === "offers" && !(p.oldPrice > p.price)) return false;
    if (curCat && curCat !== "offers" && p.cat !== curCat) return false;
    if (q && (p.name + " " + p.brand + " " + p.desc).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  list.sort(function (a, b) { return (b.featured ? 1 : 0) - (a.featured ? 1 : 0); });
  var title = curCat === "offers" ? "العروض" : curCat ? A.catName(curCat) : "كل المنتجات";
  document.getElementById("listTitle").textContent = q ? "نتائج البحث" : title;
  document.getElementById("resCount").textContent = list.length + " منتج";
  document.getElementById("grid").innerHTML = list.length ? list.map(card).join("") : '<div class="empty" style="grid-column:1/-1">لا توجد منتجات مطابقة</div>';
}

function card(p) {
  var out = p.stock <= 0, sale = p.oldPrice > p.price;
  var badge = out ? '<span class="badge gray">نفد</span>' : p.rx ? '<span class="badge warn">بوصفة</span>' : sale ? '<span class="badge">خصم</span>' : "";
  return '<div class="card" onclick="showProduct(\'' + p.id + '\')">' +
    '<div class="im">' + A.productImg(p) + badge + "</div>" +
    '<div class="bd"><div class="nm">' + esc(p.name) + '</div><div class="un">' + esc(p.brand) + " · " + esc(p.unit) + "</div>" +
    '<div class="pr"><div><span class="price">' + money(p.price) + "</span>" + (sale ? '<span class="old">' + money(p.oldPrice) + "</span>" : "") + "</div>" +
    '<button class="add" ' + (out ? "disabled" : "") + ' onclick="event.stopPropagation();addToCart(\'' + p.id + '\')" aria-label="أضف للسلة">+</button></div></div></div>';
}

function showProduct(id) {
  var p = prod(id); if (!p) return;
  var out = p.stock <= 0, sale = p.oldPrice > p.price;
  openModal('<div class="pd"><div class="im">' + A.productImg(p) + "</div>" +
    '<span class="badge gray">' + esc(A.catName(p.cat)) + "</span>" +
    "<h3 style='margin:8px 0 2px'>" + esc(p.name) + "</h3>" +
    '<div style="color:var(--muted);font-size:14px">' + esc(p.brand) + " · " + esc(p.unit) + "</div>" +
    '<p style="margin:10px 0">' + esc(p.desc) + "</p>" +
    (p.rx ? '<div class="rx-note">⚠️ هذا الدواء يُصرف بوصفة طبية. سيُطلب منك إرسال صورة الوصفة عند تأكيد الطلب.</div>' : "") +
    '<div style="font-size:22px;margin:10px 0"><span class="price">' + money(p.price) + "</span>" + (sale ? '<span class="old">' + money(p.oldPrice) + "</span>" : "") + "</div>" +
    '<div style="font-size:13px;margin-bottom:12px">' + (out ? '<span class="badge gray">غير متوفر حالياً</span>' : '<span class="badge ok">متوفر</span>') + "</div>" +
    '<div style="display:flex;gap:8px"><button class="btn block" ' + (out ? "disabled" : "") + ' onclick="addToCart(\'' + p.id + '\');closeModal()">أضف إلى السلة</button><button class="btn light" onclick="closeModal()">إغلاق</button></div></div>');
}

/* ---------- السلة ---------- */
function cartItems() {
  return Object.keys(cart).map(function (id) { var p = prod(id); return p && p.active !== false ? { p: p, q: cart[id] } : null; }).filter(Boolean);
}
function cartTotals() {
  var sub = cartItems().reduce(function (s, i) { return s + i.p.price * i.q; }, 0);
  var s = db.settings, del = sub === 0 ? 0 : (s.freeDeliveryOver && sub >= s.freeDeliveryOver ? 0 : Number(s.deliveryFee || 0));
  return { sub: sub, del: del, total: sub + del };
}
function addToCart(id) {
  var p = prod(id); if (!p) return;
  var q = (cart[id] || 0) + 1;
  if (q > p.stock) { toast("الكمية المتوفرة: " + p.stock); return; }
  cart[id] = q; saveCart(); toast("أُضيف إلى السلة ✓");
}
function setQty(id, d) {
  var p = prod(id), q = (cart[id] || 0) + d;
  if (p && q > p.stock) { toast("الكمية المتوفرة: " + p.stock); return; }
  if (q <= 0) delete cart[id]; else cart[id] = q;
  saveCart(); renderCart();
}
function saveCart() {
  writeLS(CART_KEY, cart);
  document.getElementById("cartCount").textContent = cartItems().reduce(function (s, i) { return s + i.q; }, 0);
}
function openCart() { renderCart(); document.getElementById("cart").classList.add("open"); }
function closeCart() { document.getElementById("cart").classList.remove("open"); }
function renderCart() {
  var items = cartItems(), t = cartTotals(), s = db.settings;
  document.getElementById("cartList").innerHTML = items.length ? items.map(function (i) {
    return '<div class="ci"><div class="im">' + A.productImg(i.p) + '</div><div class="info"><b>' + esc(i.p.name) + "</b>" +
      '<span class="price" style="font-size:14px">' + money(i.p.price * i.q) + "</span></div>" +
      '<div class="qty"><button onclick="setQty(\'' + i.p.id + '\',1)">+</button><span>' + i.q + '</span><button onclick="setQty(\'' + i.p.id + '\',-1)">−</button></div></div>';
  }).join("") : '<div class="empty">🛒<br>السلة فارغة</div>';
  var hint = s.freeDeliveryOver && t.sub > 0 && t.sub < s.freeDeliveryOver ? '<div style="font-size:12px;color:var(--muted);margin-bottom:6px">أضف ' + money(s.freeDeliveryOver - t.sub) + " للحصول على توصيل مجاني</div>" : "";
  document.getElementById("cartFoot").innerHTML = items.length ? hint +
    '<div class="row"><span>المجموع</span><span>' + money(t.sub) + '</span></div>' +
    '<div class="row"><span>التوصيل</span><span>' + (t.del ? money(t.del) : "مجاني") + '</span></div>' +
    '<div class="row total"><span>الإجمالي</span><span class="price">' + money(t.total) + "</span></div>" +
    '<button class="btn block" style="margin-top:10px" onclick="checkout()">إتمام الطلب</button>' : "";
}

/* ---------- الدفع ---------- */
function checkout() {
  closeCart();
  var hasRx = cartItems().some(function (i) { return i.p.rx; });
  var last = readLS("alafa-customer", {});
  openModal('<h3>بيانات التوصيل</h3><form id="co" onsubmit="placeOrder(event)">' +
    '<label class="f">الاسم الكامل / اسم الصيدلية<input class="input" name="name" required value="' + esc(last.name || "") + '"></label>' +
    '<label class="f">رقم الهاتف<input class="input" name="phone" type="tel" required value="' + esc(last.phone || "") + '"></label>' +
    '<label class="f">المدينة<input class="input" name="city" required value="' + esc(last.city || "") + '"></label>' +
    '<label class="f">العنوان بالتفصيل<textarea class="input" name="address" rows="2" required>' + esc(last.address || "") + "</textarea></label>" +
    '<label class="f">نوع العميل<select class="input" name="type"><option>فرد</option><option>صيدلية</option><option>مستشفى / عيادة</option><option>موزع</option></select></label>' +
    '<label class="f">طريقة الدفع<select class="input" name="pay"><option>الدفع عند الاستلام</option><option>تحويل مصرفي</option><option>بطاقة مصرفية عند الاستلام</option></select></label>' +
    '<label class="f">ملاحظات<textarea class="input" name="notes" rows="2"></textarea></label>' +
    (hasRx ? '<div class="rx-note">طلبك يحتوي أدوية تُصرف بوصفة. أرسل صورة الوصفة عبر واتساب بعد تأكيد الطلب.</div>' : "") +
    '<div class="row total"><span>الإجمالي</span><span class="price">' + money(cartTotals().total) + "</span></div>" +
    '<button class="btn block" style="margin-top:10px">تأكيد الطلب</button></form>');
}

function placeOrder(e) {
  e.preventDefault();
  var f = new FormData(e.target), c = {};
  f.forEach(function (v, k) { c[k] = String(v).trim(); });
  writeLS("alafa-customer", { name: c.name, phone: c.phone, city: c.city, address: c.address });
  A.reload(); db = A.db;
  var t = cartTotals(), items = cartItems();
  var order = {
    id: "ALF-" + Date.now().toString().slice(-6),
    date: new Date().toISOString(), status: "new", customer: c,
    items: items.map(function (i) { return { id: i.p.id, name: i.p.name, price: i.p.price, qty: i.q }; }),
    subtotal: t.sub, delivery: t.del, total: t.total
  };
  items.forEach(function (i) { i.p.stock = Math.max(0, i.p.stock - i.q); });
  db.orders.unshift(order); A.save();
  var mine = readLS(MY_KEY, []); mine.unshift(order.id); writeLS(MY_KEY, mine);
  cart = {}; saveCart(); renderProducts();

  var msg = "طلب جديد من متجر ALAFA\nرقم الطلب: " + order.id + "\n\n" +
    order.items.map(function (i) { return "• " + i.name + " × " + i.qty + " = " + money(i.price * i.qty); }).join("\n") +
    "\n\nالمجموع: " + money(t.sub) + "\nالتوصيل: " + money(t.del) + "\nالإجمالي: " + money(t.total) +
    "\n\nالاسم: " + c.name + "\nالهاتف: " + c.phone + "\nالمدينة: " + c.city + "\nالعنوان: " + c.address +
    "\nنوع العميل: " + c.type + "\nالدفع: " + c.pay + (c.notes ? "\nملاحظات: " + c.notes : "");
  var wa = "https://wa.me/" + db.settings.whatsapp + "?text=" + encodeURIComponent(msg);
  openModal('<div style="text-align:center"><div style="font-size:60px">✅</div><h3>تم استلام طلبك</h3>' +
    "<p>رقم الطلب: <b>" + order.id + "</b><br>سيتواصل معك فريق ألفا الطبية لتأكيد الطلب.</p>" +
    '<a class="btn block" target="_blank" rel="noopener" href="' + wa + '">💬 أرسل الطلب عبر واتساب</a>' +
    '<button class="btn light block" style="margin-top:8px" onclick="closeModal()">متابعة التسوق</button></div>');
}

function renderMyOrders() {
  A.reload(); db = A.db;
  var ids = readLS(MY_KEY, []);
  var list = db.orders.filter(function (o) { return ids.indexOf(o.id) >= 0; });
  var cls = { new: "", confirmed: "ok", shipping: "warn", delivered: "ok", cancelled: "gray" };
  document.getElementById("myOrders").innerHTML = list.length ? list.map(function (o) {
    return '<div class="ord"><div class="row"><b>' + o.id + '</b><span class="badge ' + cls[o.status] + '">' + A.STATUSES[o.status] + "</span></div>" +
      '<div style="font-size:13px;color:var(--muted)">' + new Date(o.date).toLocaleString("ar-LY") + "</div>" +
      '<div style="font-size:14px;margin:6px 0">' + o.items.map(function (i) { return esc(i.name) + " × " + i.qty; }).join("، ") + "</div>" +
      '<div class="row total"><span>الإجمالي</span><span class="price">' + money(o.total) + "</span></div></div>";
  }).join("") : '<div class="empty">📦<br>لا توجد طلبات بعد</div>';
}

function go(v) {
  ["home", "ordersView", "contactView"].forEach(function (s) { document.getElementById(s).hidden = s !== v; });
  document.querySelectorAll(".tabs button[data-v]").forEach(function (b) { b.classList.toggle("on", b.dataset.v === v); });
  if (v === "ordersView") renderMyOrders();
  if (v !== "home") window.scrollTo(0, 0);
}
function openModal(h) { document.getElementById("modalBody").innerHTML = h; document.getElementById("modal").classList.add("open"); }
function closeModal() { document.getElementById("modal").classList.remove("open"); }

/* تحديث تلقائي عند تعديل البيانات من لوحة التحكم في تبويب آخر */
window.addEventListener("storage", function (e) {
  if (e.key === A.KEY) { A.reload(); db = A.db; renderInfo(); renderCats(); renderProducts(); }
});

renderInfo(); renderCats(); renderProducts(); saveCart();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
